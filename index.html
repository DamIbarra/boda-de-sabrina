<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta Regresiva 211</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: una sola columna centrada, numero grande de dias como protagonista, barra de progreso debajo */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #14212b;
  --muted: #5d6b77;
  --line: #d9e0e6;
  --accent: #0b6e6e;
  --track: #dfe7ec;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d; --surface: #16232b; --fg: #e8eef2; --muted: #93a3af;
    --line: #26363f; --accent: #4fd1c5; --track: #26363f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d; --surface: #16232b; --fg: #e8eef2; --muted: #93a3af;
  --line: #26363f; --accent: #4fd1c5; --track: #26363f; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 500; color: var(--muted); margin: 0; text-wrap: balance; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; }
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.big #days { font-family: var(--font-display); font-weight: 700; font-size: clamp(4.5rem, 24vw, 7.5rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.big span.l { font-size: 1.25rem; color: var(--muted); }
.clock { display: flex; gap: 20px; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 1.25rem; flex-wrap: wrap; }
.clock small { display: block; font-family: var(--font-body); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s; }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; }
.set { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); min-width: 0; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 9.5rem; max-width: 100%; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.done { color: var(--accent); font-family: var(--font-display); font-size: 1.4rem; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
body { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Cuenta regresiva de <span id="total">211</span> días</h1>
  <section class="card" aria-live="polite">
    <div class="big"><span id="days">0</span><span class="l" id="lbl">días restantes</span></div>
    <div class="clock">
      <div><span id="h">00</span><small>horas</small></div>
      <div><span id="m">00</span><small>minutos</small></div>
      <div><span id="s">00</span><small>segundos</small></div>
    </div>
    <div>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <div class="meta">
      <span>Inicio: <b id="start">—</b></span>
      <span>Termina: <b id="end">—</b></span>
      <span>Avance: <b id="pct">0%</b></span>
    </div>
  </section>
  <div class="set">
    <label for="startIn">Fecha de inicio
      <input id="startIn" type="date">
    </label>
    <label for="totalIn">Total de días
      <input id="totalIn" type="number" min="1" max="3650">
    </label>
  </div>
</main>

<script>
const DEFAULT_START = "2026-11-21", DEFAULT_TOTAL = 211;
const $ = id => document.getElementById(id);
let startStr = DEFAULT_START, total = DEFAULT_TOTAL;
try {
  startStr = localStorage.getItem("cd211_start") || startStr;
  total = parseInt(localStorage.getItem("cd211_total")) || total;
} catch (e) {}

const fmt = d => d.toLocaleDateString("es", { day: "numeric", month: "long", year: "numeric" });
const pad = n => String(n).padStart(2, "0");

function tick() {
  const [y, mo, d] = startStr.split("-").map(Number);
  const start = new Date(y, mo - 1, d);
  const end = new Date(y, mo - 1, d + total);
  const now = new Date();
  const left = end - now;
  $("total").textContent = total;
  $("start").textContent = fmt(start);
  $("end").textContent = fmt(end);
  if (left <= 0) {
    $("days").textContent = "0";
    $("lbl").textContent = "¡Llegó el día!";
    $("h").textContent = $("m").textContent = $("s").textContent = "00";
    $("fill").style.width = "100%"; $("pct").textContent = "100%";
    return;
  }
  const days = Math.floor(left / 864e5);
  $("days").textContent = days;
  $("lbl").textContent = days === 1 ? "día restante" : "días restantes";
  $("h").textContent = pad(Math.floor(left / 36e5) % 24);
  $("m").textContent = pad(Math.floor(left / 6e4) % 60);
  $("s").textContent = pad(Math.floor(left / 1e3) % 60);
  const pct = Math.min(100, Math.max(0, (now - start) / (end - start) * 100));
  $("fill").style.width = pct + "%";
  $("pct").textContent = pct.toFixed(1) + "%";
}

$("startIn").value = startStr;
$("totalIn").value = total;
$("startIn").addEventListener("change", e => {
  if (!e.target.value) return;
  startStr = e.target.value;
  try { localStorage.setItem("cd211_start", startStr); } catch (e) {}
  tick();
});
$("totalIn").addEventListener("change", e => {
  const v = parseInt(e.target.value);
  if (!v || v < 1) return;
  total = v;
  try { localStorage.setItem("cd211_total", total); } catch (e) {}
  tick();
});
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
