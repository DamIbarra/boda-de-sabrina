<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boda de Sabrina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Concepto: noche de gala. Fondo ciruela profundo, aura dorada y rosa que respira detras del numero de dias, rayos de luz giratorios y petalos/chispas flotando. */
:root {
  --night: #12060f;
  --plum: #2a0f26;
  --gold: #f3d38a;
  --gold-deep: #c99a3e;
  --rose: #ff9fb8;
  --blush: #ffe4ec;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Montserrat", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--blush); font-family: var(--font-body);
  overflow-x: hidden; position: relative;
  padding-block: 52px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
body::before { /* resplandor de fondo */
  content: ""; position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(60% 50% at 50% 38%, rgba(255,159,184,.28), transparent 70%),
    radial-gradient(80% 60% at 50% 110%, rgba(243,211,138,.18), transparent 70%),
    linear-gradient(180deg, #1c0a19, var(--night));
}
.rays { /* rayos de luz giratorios */
  position: fixed; left: 50%; top: 38%; width: 160vmax; height: 160vmax; z-index: 0;
  translate: -50% -50%;
  background: repeating-conic-gradient(from 0deg, rgba(243,211,138,.10) 0deg 4deg, transparent 4deg 16deg);
  mask-image: radial-gradient(circle, #000 0%, transparent 55%);
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%);
  animation: spin 90s linear infinite;
}
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
main { position: relative; z-index: 2; width: 100%; max-width: 720px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.eyebrow { font-size: .78rem; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); margin: 0; }
h1 {
  font-family: var(--font-display); font-weight: 600; font-style: italic; margin: 0;
  font-size: clamp(2.6rem, 11vw, 5.2rem); line-height: 1.05; text-wrap: balance;
  background: linear-gradient(180deg, #fff6dc 0%, var(--gold) 50%, var(--gold-deep) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(243,211,138,.45));
}
.orb { position: relative; display: grid; place-items: center; width: min(78vw, 360px); aspect-ratio: 1; margin-block: 6px; }
.orb::before, .orb::after { content: ""; position: absolute; border-radius: 50%; }
.orb::before { /* aura */
  inset: -14%; background: radial-gradient(circle, rgba(255,159,184,.55), rgba(243,211,138,.25) 45%, transparent 70%);
  filter: blur(18px); animation: breathe 4.5s ease-in-out infinite;
}
.orb::after { /* anillo dorado */
  inset: 0; border: 2px solid rgba(243,211,138,.75);
  box-shadow: 0 0 28px rgba(243,211,138,.55), inset 0 0 40px rgba(255,159,184,.35);
}
.ring { position: absolute; inset: 7%; border-radius: 50%; border: 1px dashed rgba(255,228,236,.45); animation: spin 40s linear infinite reverse; }
.num { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; line-height: 1; }
#days {
  font-family: var(--font-display); font-weight: 600; font-size: clamp(5.5rem, 28vw, 10rem); font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff 0%, var(--blush) 45%, var(--rose) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(255,159,184,.8));
}
#lbl { font-size: .78rem; letter-spacing: .4em; text-transform: uppercase; color: var(--gold); margin-top: 4px; padding-left: .4em; }
.clock { display: flex; gap: clamp(10px, 4vw, 28px); justify-content: center; flex-wrap: wrap; }
.clock div { min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 14px; border-radius: 14px; background: rgba(255,228,236,.06); border: 1px solid rgba(243,211,138,.28); backdrop-filter: blur(4px); }
.clock span { font-family: var(--font-display); font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--gold); }
.clock small { font-size: .62rem; letter-spacing: .25em; text-transform: uppercase; color: var(--blush); opacity: .8; }
.bar { width: min(100%, 420px); height: 6px; border-radius: 99px; background: rgba(255,228,236,.14); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold)); box-shadow: 0 0 12px var(--gold); transition: width .8s; }
.date { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 1.3rem; color: var(--blush); }
.date b { color: var(--gold); font-weight: 600; }
.small { margin: 0; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
.cheer { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 1.7rem; color: var(--gold); text-shadow: 0 0 14px rgba(243,211,138,.5); }
#days, .clock span { font-variant-numeric: lining-nums tabular-nums; }
.dress { max-width: 460px; padding: 16px 20px; border-radius: 14px; background: rgba(255,228,236,.06); border: 1px solid rgba(243,211,138,.28); display: flex; flex-direction: column; gap: 6px; }
.dress h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 1.5rem; color: var(--gold); }
.dress p { margin: 0; font-size: .9rem; line-height: 1.5; color: var(--blush); }
.dress em { color: var(--rose); font-style: normal; font-weight: 600; }
#snd { font: inherit; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); background: rgba(255,228,236,.06);
  border: 1px solid rgba(243,211,138,.45); border-radius: 99px; padding: 5px 12px; cursor: pointer;
  position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
#snd:hover { background: rgba(243,211,138,.15); }
#snd:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
@keyframes spin { to { rotate: 360deg; } }
@keyframes breathe { 0%,100% { opacity: .65; scale: .96; } 50% { opacity: 1; scale: 1.06; } }
@media (prefers-reduced-motion: reduce) { .rays, .ring, .orb::before { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div class="rays" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <p class="cheer">Fuerza Rodrigo</p>
  <p class="eyebrow">Cuenta regresiva</p>
  <h1>Boda de Sabrina</h1>
  <div class="orb" aria-live="polite">
    <div class="ring" aria-hidden="true"></div>
    <div class="num"><span id="days">0</span><span id="lbl">días</span></div>
  </div>
  <div class="clock">
    <div><span id="h">00</span><small>horas</small></div>
    <div><span id="m">00</span><small>minutos</small></div>
    <div><span id="s">00</span><small>segundos</small></div>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <p class="date">Nos vemos el <b id="end">—</b></p>
  <button id="snd" type="button" aria-pressed="false">🔔 Activar sonido del reloj</button>
  <section class="dress">
    <h2>Vestimenta elegante</h2>
    <p>Vestimenta Elegante. Nada de <em>L-Gante</em>, <em>champion</em> o <em>Zapatón</em>.</p>
  </section>
  <p class="small">Faltan 211 días desde el 21 de noviembre de 2026</p>
</main>

<script>
const START = new Date(2026, 10, 21), END = new Date(2026, 10, 21 + 211);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
$("end").textContent = END.toLocaleDateString("es", { day: "numeric", month: "long", year: "numeric" });

function tick() {
  const now = new Date(), left = END - now;
  if (left <= 0) {
    $("days").textContent = "0"; $("lbl").textContent = "¡Es hoy!";
    $("h").textContent = $("m").textContent = $("s").textContent = "00";
    $("fill").style.width = "100%"; return;
  }
  const d = Math.floor(left / 864e5);
  $("days").textContent = d;
  $("lbl").textContent = d === 1 ? "día" : "días";
  $("h").textContent = pad(Math.floor(left / 36e5) % 24);
  $("m").textContent = pad(Math.floor(left / 6e4) % 60);
  $("s").textContent = pad(Math.floor(left / 1e3) % 60);
  $("fill").style.width = Math.min(100, Math.max(0, (now - START) / (END - START) * 100)) + "%";
}
/* sonido de reloj: usa los dos tics reales (tic y tac) recortados del audio de referencia, incrustados en la pagina */

function clockSound() {
  if (!soundOn || !ac) return;
  const b = bufs[beat++ % 2]; if (!b) return;
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = .9;
  s.connect(g).connect(ac.destination); s.start();
}
$("snd").addEventListener("click", () => {
  soundOn = !soundOn;
  if (soundOn) { if (!ac) setupAudio(); ac.resume(); }
  $("snd").textContent = soundOn ? "🔕 Silenciar reloj" : "🔔 Activar sonido del reloj";
  $("snd").setAttribute("aria-pressed", soundOn);
});
tick(); setInterval(() => { tick(); clockSound(); }, 1000);

/* petalos y chispas flotando */
const cv = $("fx"), cx = cv.getContext("2d");
let W, H, parts = [];
const colors = ["255,159,184", "243,211,138", "255,228,236"];
function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
function mk(init) {
  const petal = Math.random() < .55;
  return { x: Math.random() * W, y: init ? Math.random() * H : -20, r: (petal ? 5 : 1.8) * devicePixelRatio * (.6 + Math.random()),
    vy: (.25 + Math.random() * .6) * devicePixelRatio, vx: (Math.random() - .5) * .4 * devicePixelRatio,
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .02, c: colors[(Math.random() * 3) | 0], a: .35 + Math.random() * .5, petal, t: Math.random() * 6 };
}
size(); addEventListener("resize", size);
const N = Math.min(70, Math.round(innerWidth / 14));
for (let i = 0; i < N; i++) parts.push(mk(true));
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame() {
  cx.clearRect(0, 0, W, H);
  for (const p of parts) {
    p.t += .02; p.y += p.vy; p.x += p.vx + Math.sin(p.t) * .4 * devicePixelRatio; p.rot += p.vr;
    if (p.y > H + 20) Object.assign(p, mk(false));
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = p.a;
    if (p.petal) { cx.fillStyle = `rgb(${p.c})`; cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.283); cx.fill(); }
    else { cx.fillStyle = `rgb(${p.c})`; cx.shadowColor = `rgb(${p.c})`; cx.shadowBlur = 10; cx.beginPath(); cx.arc(0, 0, p.r, 0, 6.283); cx.fill(); }
    cx.restore();
  }
  if (!still) requestAnimationFrame(frame);
}
frame();
</script>
